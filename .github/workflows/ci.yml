name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qrevent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qrevent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend and migration code
        run: python -m compileall -q backend scripts

      - name: Verify backend imports
        env:
          DATABASE_URL: sqlite:///./ci-qrevent.db
        run: python -c "from backend.main import app; print('backend import ok')"

      - name: Test production security configuration validation
        run: python scripts/test_security_config.py -v

      - name: Test notification provider configuration
        run: python scripts/test_notification_config.py -v

      - name: Run PostgreSQL API regression suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/qrevent_test
        run: python scripts/test_api_regression.py

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Type check mobile app
        run: npm run typecheck

      - name: Export web build
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npx expo export --platform web

  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for whitespace errors
        run: git diff --check
